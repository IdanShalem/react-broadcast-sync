name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    # Only release after the CI workflow succeeded on the same commit.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Job-level on purpose: the Build, verify, and Release (publish-time
      # prepack) steps must all see the same token. Removing it makes the
      # verify step fail instead of shipping a bundle with an empty token.
      MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout main at the verified commit
        run: git checkout -B main ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify publish-time build keeps the telemetry token
        # npm pack runs the prepack script, exactly like npm publish does, so
        # this exercises the real publish-time build path.
        run: |
          npm pack >/dev/null
          npm run verify:telemetry

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
